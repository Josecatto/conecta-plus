<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11163A">
<meta name="description" content="CONECTA+: sitio educativo sobre ciudadanía digital y uso responsable de redes sociales para estudiantes de 7.º a 10.º grado.">
<title>CONECTA+ · Antes de publicar, piensa</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%2311163A'/><path d='M50 28v44M28 50h44' stroke='%23FF4D7E' stroke-width='14' stroke-linecap='round'/></svg>">
<style>
:root{
  --ink:#11163A; --ink2:#434968; --muted:#676D8F; --bg:#F4F6FB; --card:#FFFFFF; --line:rgba(17,22,58,.10);
  --blue:#3D5AFE; --blue-d:#2A3EB1; --blue-l:#E8ECFF;
  --pink:#FF4D7E; --pink-d:#C2264D; --pink-l:#FFE6EE;
  --cyan:#00A6C7; --cyan-l:#DDF6FB;
  --amber:#F59E0B; --amber-d:#92400E; --amber-l:#FEF3C7;
  --violet:#7C3AED; --violet-l:#EDE7FE;
  --ok:#11795A; --ok-bg:#E2F6EE; --ok-line:#5DC9A3;
  --bad:#C2264D; --bad-bg:#FFE8EE; --bad-line:#FF9BB5;
  --r:22px; --shadow:0 10px 34px rgba(17,22,58,.08);
  --c:var(--blue); --cl:var(--blue-l);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{margin:0;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:16px;overflow-x:hidden}
h1,h2,h3,h4{font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;line-height:1.15;letter-spacing:-.02em;margin:0 0 .5em}
h1{font-weight:900} h2{font-weight:850} h3,h4{font-weight:800}
a{color:var(--blue)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
svg.i{width:1.15em;height:1.15em;vertical-align:-.2em;flex-shrink:0}
.grad{background:linear-gradient(90deg,var(--blue),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}

/* header */
.top{position:sticky;top:0;z-index:50;background:rgba(244,246,251,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .bar1{display:flex;align-items:center;gap:12px;height:58px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:900;font-size:1.15rem;letter-spacing:.02em}
.logo .mk{width:32px;height:32px;border-radius:10px;background:var(--ink);display:flex;align-items:center;justify-content:center}
.logo b{color:var(--pink)}
.gprog{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 280px}
.gprog .track{flex:1;height:9px;background:#E3E7F3;border-radius:99px;overflow:hidden}
.gprog .track i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--pink));border-radius:99px;transition:width .5s}
.gprog span{font-weight:800;font-size:.85rem;color:var(--ink2);white-space:nowrap}
.nav{display:flex;gap:6px;overflow-x:auto;padding:0 0 9px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex-shrink:0;display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink2);font-weight:750;font-size:.9rem;padding:7px 12px;border-radius:99px;border:1.5px solid transparent;white-space:nowrap}
.nav a .n{width:22px;height:22px;border-radius:7px;background:#E3E7F3;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:900}
.nav a:hover{background:#fff;border-color:var(--line)}
.nav a.on{background:var(--ink);color:#fff}
.nav a.on .n{background:var(--sc,var(--pink));color:#fff}
.nav a.done .n{background:var(--ok);color:#fff}
@media (min-width:900px){.nav{justify-content:center}}

/* buttons */
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:800;background:var(--ink);color:#fff;display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-size:1rem;transition:transform .12s,background .2s}
.btn:hover{background:#262c5a}
.btn:active{transform:scale(.98)}
.btn.c{background:var(--c)}
.btn.c:hover{filter:brightness(.92)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{padding:8px 14px;font-size:.9rem;border-radius:12px}

/* hero */
.hero{background:var(--ink);color:#fff;border-radius:0 0 34px 34px;overflow:hidden;position:relative}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(10px);opacity:.55}
.hero::before{width:360px;height:360px;background:radial-gradient(circle,#3D5AFE,transparent 68%);top:-120px;right:-80px}
.hero::after{width:320px;height:320px;background:radial-gradient(circle,#FF4D7E,transparent 68%);bottom:-170px;left:-90px}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1fr;gap:20px;padding-top:34px;padding-bottom:40px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;font-weight:700;font-size:.8rem;padding:5px 11px;border-radius:99px}
.hero h1{font-size:clamp(2.3rem,8vw,3.8rem);margin:14px 0 6px}
.hero h1 b{color:var(--pink)}
.hero .slogan{font-size:clamp(1.05rem,3.4vw,1.35rem);font-weight:750;color:#C9CFF5;margin:0 0 14px}
.hero p{color:#D7DBF4;margin:0 0 20px;max-width:560px}
.hero .btn{background:var(--pink)}
.hero .btn:hover{background:#ff3b70}
.hero .art{max-width:330px;width:100%;margin:0 auto}
.float{animation:float 5s ease-in-out infinite}
.float.d2{animation-delay:-1.6s} .float.d3{animation-delay:-3.2s}
@keyframes float{50%{transform:translateY(-8px)}}

/* generic cards */
.blk{margin:26px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.grid2,.grid3,.grid5{display:grid;grid-template-columns:1fr;gap:12px}
.mini{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.mini .ic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;background:var(--cl);color:var(--c)}
.mini h4{margin:0 0 4px;font-size:1.02rem}
.mini p{margin:0;color:var(--ink2);font-size:.95rem}
.kicker{font-size:.76rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.h2{font-size:clamp(1.4rem,4.4vw,1.9rem);margin:4px 0 8px}
.lead{color:var(--ink2);margin:0 0 14px}
.obj{border-left:5px solid var(--pink);background:#fff;border-radius:0 18px 18px 0;padding:16px 18px;box-shadow:var(--shadow)}
.obj b{color:var(--pink-d)}

/* section page */
.shead{margin-top:20px;border-radius:var(--r);padding:22px;color:#fff;background:var(--ink);position:relative;overflow:hidden}
.shead::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--c);opacity:.55;filter:blur(6px)}
.shead > *{position:relative;z-index:1}
.shead .k{font-weight:900;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:#C9CFF5}
.shead h2{font-size:clamp(1.6rem,5vw,2.3rem);margin:4px 0 8px}
.shead p{margin:0 0 14px;color:#D7DBF4;max-width:640px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks span{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:750;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:4px 11px}
.checks span.ok{background:var(--ok);border-color:var(--ok)}
.part{margin:22px 0}
.ptag{display:inline-flex;align-items:center;gap:7px;font-weight:900;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--c);background:var(--cl);padding:5px 11px;border-radius:99px;margin-bottom:10px}
.part > .card h3{font-size:1.3rem}
.txt p{margin:0 0 .8em} .txt p:last-child{margin:0}
.hl{background:linear-gradient(transparent 58%,var(--cl) 58%);font-weight:800}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--cl);border-radius:16px;padding:14px;margin-top:14px}
.tip .ic{color:var(--c);flex-shrink:0;margin-top:2px}
.tip p{margin:0}
.snav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:24px 0 40px}

/* infografía huella */
.vs{display:grid;grid-template-columns:1fr;gap:12px}
.vs .side{border-radius:18px;padding:16px;border:2px solid var(--line);background:#fff}
.vs .side h4{display:flex;align-items:center;gap:8px}
.vs ul{margin:6px 0 0;padding-left:20px} .vs li{margin:4px 0}

/* video */
.vid{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000 center/cover no-repeat;margin:12px 0}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid .play{position:absolute;inset:0;border:0;width:100%;background:linear-gradient(rgba(17,22,58,.15),rgba(17,22,58,.65));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:800}
.vid .play .pi{width:68px;height:68px;border-radius:50%;background:var(--pink);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(255,77,126,.45);transition:transform .2s}
.vid .play:hover .pi{transform:scale(1.08)}
.vmeta{font-size:.88rem;color:var(--muted)} .vmeta a{font-weight:800}
.orient{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1.5px dashed var(--c);border-radius:16px;padding:12px 14px;margin-bottom:6px}
.orient b{color:var(--c)}

/* quiz y retroalimentación */
.q{border:1.5px solid var(--line);border-radius:18px;padding:16px;margin:0 0 12px;background:#fff}
.q .qt{font-weight:800;margin-bottom:10px}
.q .num{display:inline-flex;width:26px;height:26px;border-radius:8px;background:var(--c);color:#fff;align-items:center;justify-content:center;font-size:.8rem;margin-right:8px;vertical-align:1px}
.opts{display:grid;grid-template-columns:1fr;gap:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:11px 13px;font-weight:650;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--c);background:var(--cl)}
.opt .l{width:26px;height:26px;border-radius:8px;background:#EEF0F7;color:var(--ink2);display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0;font-size:.82rem}
.locked .opt{pointer-events:none}
.opt.ok{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok)} .opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad-line);background:var(--bad-bg);color:var(--bad);animation:shake .35s} .opt.bad .l{background:var(--bad);color:#fff}
.locked .opt:not(.ok):not(.bad){opacity:.5}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{display:flex;gap:10px;align-items:flex-start;margin-top:10px;border-radius:14px;padding:11px 13px;font-size:.95rem;animation:pop .25s}
.fb.ok{background:var(--ok-bg);color:var(--ok)} .fb.bad{background:var(--bad-bg);color:var(--bad)} .fb.info{background:var(--cl);color:var(--ink)}
.fb .t{display:block;font-weight:900}
.fb .ico{flex-shrink:0;margin-top:2px}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.tally{display:flex;align-items:center;flex-wrap:wrap;gap:10px;background:var(--cl);border-radius:16px;padding:12px 14px;font-weight:800;margin-top:6px}
.tally .sp{flex:1}
.res{border-radius:16px;padding:14px;margin-top:10px;font-weight:700;display:flex;gap:12px;align-items:center}
.res.good{background:var(--ok-bg);color:var(--ok)} .res.mid{background:var(--amber-l);color:var(--amber-d)}
.res .big{font-size:1.8rem;font-weight:900;line-height:1}

/* ¿Lo publicarías? (posts) */
.posts{display:grid;grid-template-columns:1fr;gap:14px}
.post{background:#fff;border:1.5px solid var(--line);border-radius:20px;overflow:hidden}
.post .ph{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:.85rem;flex-shrink:0}
.post .who{font-weight:800;font-size:.92rem;line-height:1.2} .post .who small{display:block;color:var(--muted);font-weight:600}
.post .pic{margin:0 14px;border-radius:14px;height:120px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:#fff;font-weight:800;text-align:center;padding:10px}
.post .cap{padding:10px 14px 4px;font-size:.95rem}
.post .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 14px 14px}
.post .acts button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}
.post .acts button:hover{border-color:var(--c)}
.post.locked .acts button{pointer-events:none}
.post .acts button.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.post .acts button.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.post .fb{margin:0 14px 14px}

/* chat simulado */
.phone{max-width:420px;margin:0 auto;background:#fff;border:1.5px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:var(--shadow)}
.phone .bar{background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;font-weight:800}
.phone .bar small{display:block;font-weight:600;color:#C9CFF5;font-size:.75rem}
.chat{padding:14px;display:flex;flex-direction:column;gap:8px;background:#F1F3FA;min-height:260px}
#chatfb .fb{margin:10px 0 0}
.msg{max-width:84%;padding:9px 12px;border-radius:16px;font-size:.93rem;line-height:1.4;animation:pop .3s}
.msg small{display:block;font-weight:800;font-size:.72rem;opacity:.7}
.msg.them{background:#fff;border-bottom-left-radius:5px;align-self:flex-start}
.msg.me{background:var(--c);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.msg.sys{align-self:center;background:var(--amber-l);color:var(--amber-d);font-weight:700;font-size:.82rem;text-align:center;max-width:95%}
.msg.img{background:#fff;padding:6px;border-bottom-left-radius:5px}
.msg.img .fake{height:90px;border-radius:12px;background:repeating-linear-gradient(45deg,#FFD3DF,#FFD3DF 10px,#FFE6EE 10px,#FFE6EE 20px);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--pink-d);font-size:.82rem;text-align:center;padding:6px}
.choices{padding:12px;display:grid;gap:8px;border-top:1px solid var(--line)}
.choices .lbl{font-size:.8rem;font-weight:800;color:var(--muted)}
.choices button{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;font-weight:700}
.choices button:hover{border-color:var(--c);background:var(--cl)}

/* ayuda */
.help{display:grid;grid-template-columns:1fr;gap:10px}
.help a{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px}
.help a:hover{border-color:var(--c)}
.help .ic{width:40px;height:40px;border-radius:12px;background:var(--cl);color:var(--c);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.help b{display:block} .help small{color:var(--muted)}

/* ruta de verificación / ordenar */
.steps4{display:grid;grid-template-columns:1fr;gap:10px;counter-reset:s}
.step4{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px}
.step4 .n{width:40px;height:40px;border-radius:12px;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.1rem;flex-shrink:0}
.step4 h4{margin:0 0 2px} .step4 p{margin:0;color:var(--ink2);font-size:.95rem}
.order{display:flex;flex-direction:column;gap:8px}
.order .slot{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--line);border-radius:14px;padding:10px 12px;min-height:48px;background:#fff}
.order .slot .n{width:28px;height:28px;border-radius:9px;background:#EEF0F7;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
.order .slot.filled{border-style:solid;border-color:var(--c)}
.order .slot.ok{border-color:var(--ok-line);background:var(--ok-bg)} .order .slot.bad{border-color:var(--bad-line);background:var(--bad-bg)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.pill{border:1.5px solid var(--c);background:#fff;color:var(--ink);border-radius:99px;padding:7px 14px;font-weight:750}
.pill:hover{background:var(--cl)} .pill.used{opacity:.25;pointer-events:none}

/* señales en publicación falsa */
.newsfeed{display:grid;grid-template-columns:1fr;gap:14px}
.news{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:14px}
.news .src{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);font-weight:700}
.news .hd{font-weight:850;font-size:1.05rem;margin:8px 0 6px;line-height:1.3}
.news .bd{font-size:.93rem;color:var(--ink2);margin:0 0 10px}
.news .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.news .acts button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px;font-weight:800}
.news .acts button:hover{border-color:var(--c)}
.news.locked .acts button{pointer-events:none}
.news .acts button.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.news .acts button.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}

/* contraseña */
.pw{display:flex;gap:8px;flex-wrap:wrap}
.pw input{flex:1 1 240px;font:inherit;font-weight:700;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
.pw input:focus{outline:none;border-color:var(--c)}
.meter{height:12px;background:#E3E7F3;border-radius:99px;overflow:hidden;margin:12px 0 6px}
.meter i{display:block;height:100%;width:0;border-radius:99px;transition:width .3s,background .3s}
.rules{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.rules li{display:flex;gap:8px;align-items:center;font-size:.95rem;color:var(--muted)}
.rules li.on{color:var(--ok);font-weight:700}
.rules li .dot{width:20px;height:20px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rules li.on .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.warn{font-size:.88rem;color:var(--amber-d);background:var(--amber-l);border-radius:12px;padding:8px 12px;margin-top:10px}

/* privacidad (toggles) */
.profile{display:grid;grid-template-columns:1fr;gap:16px}
.settings{display:flex;flex-direction:column;gap:10px}
.set{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px}
.set .tx{flex:1} .set .tx b{display:block;font-size:.97rem} .set .tx small{color:var(--muted)}
.sw{position:relative;width:50px;height:28px;border-radius:99px;border:0;background:#CBD0E2;flex-shrink:0;transition:background .2s;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.sw[aria-checked="true"]{background:var(--c)}
.sw[aria-checked="true"]::after{transform:translateX(22px)}
.set .st{font-size:.8rem;font-weight:800;min-width:66px;text-align:right}
.score{background:var(--ink);color:#fff;border-radius:20px;padding:18px;text-align:center}
.ring{width:130px;height:130px;margin:6px auto}
.score b{font-size:1.1rem}

/* autoevaluación */
.likert{display:flex;flex-direction:column;gap:10px}
.lk{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px}
.lk p{margin:0 0 8px;font-weight:700}
.lk .row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lk .row button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 4px;font-weight:750;font-size:.9rem}
.lk .row button.sel{background:var(--c);border-color:var(--c);color:#fff}
textarea{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;min-height:96px;resize:vertical;color:var(--ink);background:#fff}
textarea:focus{outline:none;border-color:var(--c)}
.err{color:var(--bad);font-size:.85rem;font-weight:700;margin-top:6px}
.commit{display:grid;grid-template-columns:1fr;gap:8px}
.commit label{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;font-weight:650}
.commit input{width:20px;height:20px;accent-color:var(--violet);margin-top:2px;flex-shrink:0}
.pact{background:var(--ink);color:#fff;border-radius:24px;padding:24px 20px;margin-top:14px;position:relative;overflow:hidden}
.pact::after{content:"";position:absolute;right:-50px;bottom:-50px;width:180px;height:180px;border-radius:50%;background:var(--pink);opacity:.4;filter:blur(8px)}
.pact > *{position:relative;z-index:1}
.pact h3{font-size:1.5rem;margin-bottom:4px}
.pact ul{margin:12px 0;padding-left:20px} .pact li{margin:6px 0}
.pact .q2{color:#D7DBF4;font-style:italic;border-left:3px solid var(--pink);padding-left:10px;margin:10px 0}

/* créditos */
.refs li{margin:8px 0;word-break:break-word}
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,40px);opacity:0;z-index:80;background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;max-width:calc(100% - 32px);width:max-content;box-shadow:0 10px 30px rgba(17,22,58,.3);transition:.3s;font-weight:700;display:flex;gap:10px;align-items:center;pointer-events:none}

footer{text-align:center;color:var(--muted);font-size:.85rem;padding:20px 0 36px}

/* =========================================================
   ESTILO GLASSY (vidrio esmerilado)
   ========================================================= */
:root{
  --glass:rgba(255,255,255,.52); --glass-2:rgba(255,255,255,.68); --glass-in:rgba(255,255,255,.5);
  --glass-b:rgba(255,255,255,.75); --blur:blur(20px) saturate(170%);
  --gshadow:0 12px 40px rgba(17,22,58,.10), inset 0 1px 0 rgba(255,255,255,.8);
}
body{background:#EEF1FA}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(38% 32% at 12% 18%, rgba(61,90,254,.30), transparent 70%),
    radial-gradient(34% 30% at 88% 22%, rgba(255,77,126,.26), transparent 70%),
    radial-gradient(40% 34% at 78% 82%, rgba(0,166,199,.24), transparent 70%),
    radial-gradient(36% 32% at 18% 86%, rgba(124,58,237,.22), transparent 70%);
  animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(3%,-2%,0) scale(1.05)}}
/* paneles principales con desenfoque */
.card,.obj,.top{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-b);box-shadow:var(--gshadow)}
.top{background:rgba(238,241,250,.6);border-width:0 0 1px}
.obj{border-left:5px solid var(--pink)}
/* elementos internos: translúcidos sin desenfoque (más livianos en celular) */
.mini,.q,.post,.news,.set,.lk,.step4,.help a,.vs .side,.commit label,.order .slot,.opt,.post .acts button,.news .acts button,.lk .row button,.choices button,.pw input,textarea,.btn.ghost,.tip,.orient{background:var(--glass-in);border-color:var(--glass-b)}
.mini:hover,.help a:hover{background:var(--glass-2)}
.tip{background:color-mix(in srgb,var(--cl) 70%,transparent)}
.tally{background:color-mix(in srgb,var(--cl) 75%,transparent);border:1px solid var(--glass-b)}
.ptag{background:color-mix(in srgb,var(--cl) 80%,transparent);border:1px solid var(--glass-b)}
.nav a:hover{background:var(--glass-2);border-color:var(--glass-b)}
.gprog .track,.meter{background:rgba(17,22,58,.08)}
/* cabeceras oscuras como vidrio ahumado */
.hero{background:rgba(17,22,58,.86);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.shead,.score,.pact{background:rgba(17,22,58,.84);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 40px rgba(17,22,58,.22), inset 0 1px 0 rgba(255,255,255,.12)}
.phone{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-color:var(--glass-b)}
.phone .bar{background:rgba(17,22,58,.88)}
.chat{background:rgba(241,243,250,.55)}
.msg.them{background:rgba(255,255,255,.85)}
/* estados de respuesta: se mantienen sólidos para leerse bien */
.opt.ok,.post .acts button.ok,.news .acts button.ok,.order .slot.ok{background:var(--ok-bg)}
.opt.bad,.post .acts button.bad,.news .acts button.bad,.order .slot.bad{background:var(--bad-bg)}
.lk .row button.sel{background:var(--c)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .card,.obj,.phone{background:rgba(255,255,255,.92)} .top{background:rgba(238,241,250,.96)}
}

@media (min-width:720px){
  .hero .wrap{grid-template-columns:1.25fr 1fr;padding-top:52px;padding-bottom:56px}
  .grid2,.vs,.posts,.newsfeed,.help,.steps4,.commit{grid-template-columns:1fr 1fr}
  .grid3{grid-template-columns:repeat(3,1fr)}
  .grid5{grid-template-columns:repeat(3,1fr)}
  .opts{grid-template-columns:1fr 1fr} .opts.one{grid-template-columns:1fr}

@media print{

let ST={done:{}};

function sectionNav(p){

}

}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-yt]'); if(!b) return;
  const f=document.createElement('iframe');
  f.src=`https://www.youtube-nocookie.com/embed/${b.dataset.yt}?autoplay=1&rel=0`; f.title='Video de YouTube';
  f.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share'; f.allowFullscreen=true; f.referrerPolicy='strict-origin-when-cross-origin';
  b.replaceWith(f);
});

// Preguntas de opción múltiple con respuesta inmediata
function mcq(box, items, sec, key, opts={}){
  let ans=0, ok=0;
  box.innerHTML = items.map((it,i)=>`<div class="q" data-i="${i}"><div class="qt"><span class="num">${i+1}</span>${it.q}</div>
    <div class="opts ${it.o.some(o=>o.length>38)?'one':''}">${it.o.map((o,j)=>`<button type="button" class="opt" data-j="${j}"><span class="l">${'ABC'[j]}</span><span>${o}</span></button>`).join('')}</div><div class="fbx"></div></div>`).join('')
    + `<div class="tally"><span data-tt></span><span class="sp"></span><button class="btn ghost sm" type="button" data-again>${ico('refresh')} Reintentar</button></div><div data-res></div>`;
  const upd=()=>{
    $('[data-tt]',box).textContent=`Respondidas ${ans} de ${items.length} · Correctas ${ok}`;
    if(ans===items.length){
      const pct=ok/items.length;
      $('[data-res]',box).innerHTML=`<div class="res ${pct>=.7?'good':'mid'}"><span class="big">${ok}/${items.length}</span><span>${pct===1?'¡Excelente! Dominas el tema.':pct>=.7?'¡Muy bien! Revisa las explicaciones de las que fallaste.':'Vas en camino. Lee las explicaciones y vuelve a intentarlo.'}${opts.scoreNote?` ${opts.scoreNote(ok)}`:''}</span></div>`;
      complete(sec,key);
    }
  };
  $$('.q',box).forEach(q=>{
    const it=items[+q.dataset.i];
    $$('.opt',q).forEach(b=>b.addEventListener('click',()=>{
      const good=+b.dataset.j===it.a; q.classList.add('locked'); b.classList.add(good?'ok':'bad');
      if(!good) $(`.opt[data-j="${it.a}"]`,q).classList.add('ok');
      ans++; if(good) ok++;
      $('.fbx',q).innerHTML=fb(good?'ok':'bad', good?'¡Correcto!':`No exactamente. La respuesta es la ${'ABC'[it.a]}.`, ' '+it.why);
      upd();
    }));
  });
  $('[data-again]',box).addEventListener('click',()=>mcq(box,items,sec,key,opts));
  upd();
}

// Decidir sobre tarjetas (publicaciones / noticias)
function decide(box, tallyBox, items, render, choices, sec, key){
  let ans=0, ok=0;
  box.innerHTML=items.map((it,i)=>render(it,i)).join('');
  const upd=()=>{
    tallyBox.innerHTML=`<div class="tally"><span>Decididas ${ans} de ${items.length} · Correctas ${ok}</span><span class="sp"></span><button class="btn ghost sm" type="button" data-again>${ico('refresh')} Reintentar</button></div>${ans===items.length?`<div class="res ${ok/items.length>=.7?'good':'mid'}"><span class="big">${ok}/${items.length}</span><span>${ok===items.length?'¡Perfecto! Tienes muy buen criterio.':'¡Bien! Lee las explicaciones de las que fallaste: ahí está la clave.'}</span></div>`:''}`;
    $('[data-again]',tallyBox).addEventListener('click',()=>decide(box,tallyBox,items,render,choices,sec,key));
    if(ans===items.length) complete(sec,key);
  };
  $$('[data-card]',box).forEach(card=>{
    const it=items[+card.dataset.card];
    $$('[data-v]',card).forEach(b=>b.addEventListener('click',()=>{
      const good=b.dataset.v===it.ans; card.classList.add('locked'); b.classList.add(good?'ok':'bad');
      if(!good) $(`[data-v="${it.ans}"]`,card).classList.add('ok');
      ans++; if(good) ok++;
      card.insertAdjacentHTML('beforeend', fb(good?'ok':'bad', good?choices.ok(it):choices.bad(it), ' '+it.why));
      upd();
    }));
  });
  upd();
}

    <div class="fbx"></div><div style="margin-top:10px"><button class="btn ghost sm" type="button" data-again>${ico('refresh')} Reiniciar</button></div>`;
  let pos=0, misses=0;
  $$('.pill',box).forEach(p=>p.addEventListener('click',()=>{

      if(pos===correct.length) complete(sec,key);
    }else{

}

    {t:'Al menos un número', f:s=>/\d/.test(s)},
    {t:'Al menos un símbolo (! _ # $ …)', f:s=>/[^A-Za-z0-9\s]/.test(s)},
    {t:'Sin palabras obvias ni secuencias (123, abc, password, qwerty…)', f:s=>s.length>0&&!/(123|234|345|abc|qwerty|password|contrase|admin|0000|1111|asdf)/i.test(s)}
  ];
  const levels=[['Muy débil','#C2264D',8],['Débil','#E4572E',30],['Regular','#D97706',52],['Fuerte','#0891B2',76],['Muy fuerte','#11795A',100]];
  const rbox=$('#pwr');
  const check=()=>{
    const s=inp.value, met=rules.map(r=>r.f(s)), n=met.filter(Boolean).length;
    rbox.innerHTML=rules.map((r,i)=>`<li class="${met[i]?'on':''}"><span class="dot">${met[i]?ico('check'):''}</span>${r.t}</li>`).join('');
    if(!s){ $('#pwm').style.width='0'; $('#pwl').textContent='Escribe para empezar'; $('#pwl').style.color=''; return; }
    const L = n===5 ? levels[4] : levels[Math.max(0,n-1)];
    $('#pwm').style.width=L[2]+'%'; $('#pwm').style.background=L[1]; $('#pwl').textContent='Nivel: '+L[0]; $('#pwl').style.color=L[1];
    if(n===5){ $('#pwfb').innerHTML=fb('ok','¡Contraseña muy fuerte!',' Recuerda: usa una distinta para cada cuenta y activa la verificación en dos pasos.'); complete('s4','pass'); }
    else $('#pwfb').innerHTML='';
  };
  inp.addEventListener('input',check);
  const words=['Gato','Mango','Bailar','Luna','Cohete','Pizza','Volcan','Rio','Tigre','Nube','Guitarra','Selva'];
  $('#pwgen').addEventListener('click',()=>{ const w=shuffle(words); inp.value=`${w[0]}${w[1]}${w[2]}_${Math.floor(10+Math.random()*89)}!`; check(); inp.focus(); });
  check();

  // Configuración de perfil
  const state={}; SETTINGS.forEach(s=>state[s.k]=!s.safe);   // empieza con todo inseguro
  const sets=$('#sets'), score=$('#scorebox');
  sets.innerHTML=SETTINGS.map(s=>`<div class="set" data-k="${s.k}"><span class="tx"><b>${s.t}</b><small>${s.d}</small></span><span class="st"></span>
    <button class="sw" type="button" role="switch" aria-checked="false" aria-label="${esc(s.t)}"></button></div>`).join('')+'<div id="setfb"></div>';
  const draw=(changed)=>{
    let ok=0;
    SETTINGS.forEach(s=>{
      const row=$(`[data-k="${s.k}"]`,sets), on=state[s.k], good=on===s.safe; if(good) ok++;
      $('.sw',row).setAttribute('aria-checked',on);
      const st=$('.st',row); st.textContent=good?'Seguro':'Riesgo'; st.style.color=good?'var(--ok)':'var(--bad)';
    });
    const pct=Math.round(ok/SETTINGS.length*100), R=52, C=2*Math.PI*R;
    score.innerHTML=`<div style="font-weight:800;color:#C9CFF5">Nivel de privacidad de Laura</div>
      <svg class="ring" viewBox="0 0 130 130"><circle cx="65" cy="65" r="${R}" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="12"/><circle cx="65" cy="65" r="${R}" fill="none" stroke="${pct===100?'#5DC9A3':pct>=50?'#F59E0B':'#FF4D7E'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}" transform="rotate(-90 65 65)" style="transition:stroke-dashoffset .4s"/><text x="65" y="74" text-anchor="middle" font-size="28" font-weight="900" fill="#fff">${pct}%</text></svg>
      <b>${pct===100?'¡Perfil protegido!':pct>=50?'Vas bien, faltan ajustes':'Perfil muy expuesto'}</b>`;
    if(changed){ const s=SETTINGS.find(x=>x.k===changed), good=state[changed]===s.safe; $('#setfb').innerHTML=fb(good?'ok':'bad', good?'¡Buen ajuste!':'Ese cambio aumenta el riesgo.', ' '+s.why); }
    if(pct===100){ $('#setfb').innerHTML=fb('ok','¡Lo lograste!',' El perfil de Laura ya es seguro. Revisa estas mismas opciones en tus redes.'); complete('s4','perfil'); }
  };
  $$('.set',sets).forEach(row=>$('.sw',row).addEventListener('click',()=>{ state[row.dataset.k]=!state[row.dataset.k]; draw(row.dataset.k); }));
  draw();
}

function initS5(){
  mcq($('#quiz'), QUIZ, 's5','quiz');
  // Autoevaluación
  const opts=['Siempre','A veces','Nunca'], sel={};
  const L=$('#likert');
  L.innerHTML=LIKERT.map((t,i)=>`<div class="lk" data-i="${i}"><p>${i+1}. ${t}</p><div class="row">${opts.map((o,j)=>`<button type="button" data-j="${j}" aria-pressed="false">${o}</button>`).join('')}</div></div>`).join('');
  $$('.lk',L).forEach(lk=>$$('button',lk).forEach(b=>b.addEventListener('click',()=>{
    $$('button',lk).forEach(x=>{x.classList.remove('sel'); x.setAttribute('aria-pressed','false');}); b.classList.add('sel'); b.setAttribute('aria-pressed','true');
    sel[lk.dataset.i]=2-+b.dataset.j;
    const n=Object.keys(sel).length;
    if(n<LIKERT.length){ $('#likert-fb').innerHTML=fb('info',`Llevas ${n} de ${LIKERT.length}.`,' Responde todas para ver tu resultado.'); return; }
    const pts=Object.values(sel).reduce((a,b)=>a+b,0), weak=LIKERT.filter((_,i)=>sel[i]<2);
    const lvl = pts>=9 ? ['ok','Ciudadano o ciudadana digital responsable','Tienes hábitos muy seguros. ¡Comparte lo que sabes con tus amigos!'] : pts>=5 ? ['info','Vas por buen camino','Tienes buenos hábitos, pero hay cosas por reforzar.'] : ['bad','Es momento de cambiar algunos hábitos','No te preocupes: con lo que aprendiste aquí puedes empezar hoy.'];
    $('#likert-fb').innerHTML=fb(lvl[0], `${lvl[1]} (${pts} de 10 puntos)`, ' '+lvl[2]+(weak.length?`<br><b>Para mejorar:</b> ${weak.map(w=>w.charAt(0).toLowerCase()+w.slice(1,-1)).join('; ')}.`:''));
    complete('s5','auto');
  })));
  // Compromiso
  $('#commits').innerHTML=COMMITS.map((c,i)=>`<label><input type="checkbox" value="${i}"> ${c}</label>`).join('');
  const err=$('#pact-err');
  $('#pact-txt').addEventListener('input',()=>err.hidden=true);
  $$('#commits input').forEach(c=>c.addEventListener('change',()=>err.hidden=true));
  $('#pact-btn').addEventListener('click',()=>{
    const txt=$('#pact-txt').value.trim(), chosen=$$('#commits input:checked').map(c=>COMMITS[+c.value]);
    if(txt.split(/\s+/).filter(Boolean).length<8){ err.textContent='Escribe tu reflexión (al menos 8 palabras).'; err.hidden=false; $('#pact-txt').focus(); return; }
    if(chosen.length<3){ err.textContent=`Elige al menos 3 compromisos (llevas ${chosen.length}).`; err.hidden=false; return; }
    $('#pact-out').innerHTML=`<div class="pact"><div class="kicker" style="--c:#FF9BB5">CONECTA+ · Mi compromiso</div><h3>Antes de publicar, pienso. Antes de compartir, comprendo.</h3>
      <p class="q2">"${esc(txt)}"</p><b>Me comprometo a:</b><ul>${chosen.map(c=>`<li>${c}</li>`).join('')}</ul>
      <small style="color:#C9CFF5">${new Date().toLocaleDateString('es-CO',{year:'numeric',month:'long',day:'numeric'})}</small></div>
      <div class="noprint" style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" type="button" onclick="window.print()">${ico('print')} Imprimir o guardar en PDF</button></div>
      ${fb('ok','¡Reflexión final completada!',' Gracias por pensar en cómo usas las redes. Ese compromiso es el primer paso.')}`;
    complete('s5','pacto');
  });
}

/* =========================================================
   NAVEGACIÓN
   ========================================================= */
const INIT={s1:initS1,s2:initS2,s3:initS3,s4:initS4,s5:initS5};
function buildNav(){
  $('#nav').innerHTML=PAGES.map(p=>`<a href="#${p.id}" style="${p.c?`--sc:${p.c}`:''}">${p.n?`<span class="n">${p.n}</span>`:ico(p.icon)} ${p.short}</a>`).join('');
}
function route(forced){
  let id=typeof forced==='string'?forced:'inicio';
  if(typeof forced!=='string'){ try{ id=decodeURIComponent((location.hash||'#inicio').slice(1)); }catch(e){} }
  const p=PAGES.find(x=>x.id===id)||PAGES[0];
  const app=$('#app');
  if(p.c){ app.style.setProperty('--c',p.c); app.style.setProperty('--cl',p.cl); } else { app.style.removeProperty('--c'); app.style.removeProperty('--cl'); }
  app.innerHTML=VIEW[p.id](p);
  if(INIT[p.id]) INIT[p.id]();
  if(p.id==='creditos') $('#resetAll').addEventListener('click',()=>{ if(confirm('¿Reiniciar todo tu progreso en este navegador?')){ ST={done:{}}; save(); renderProgress(); toast(`${ico('refresh')} Progreso reiniciado`); } });
  $$('.nav a').forEach(a=>{ const on=a.getAttribute('href')==='#'+p.id; a.classList.toggle('on',on); if(on){ a.setAttribute('aria-current','page'); a.scrollIntoView({block:'nearest',inline:'nearest'}); } else a.removeAttribute('aria-current'); });
  document.title = p.id==='inicio' ? 'CONECTA+ · Antes de publicar, piensa' : `${p.title||p.short} · CONECTA+`;
  renderProgress(); window.scrollTo({top:0});
}
function go(h){ h=h.replace(/^#/,''); try{ history.pushState(null,'','#'+h); }catch(e){} route(h); }
document.addEventListener('click',e=>{ const a=e.target.closest('a[href^="#"]'); if(!a) return; const h=a.getAttribute('href').slice(1); if(!PAGES.some(p=>p.id===h)) return; e.preventDefault(); go(h); });
window.addEventListener('popstate',()=>route());
window.addEventListener('hashchange',()=>route());
buildNav(); route();
</script>
